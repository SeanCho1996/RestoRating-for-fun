<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="重置 Newmarket 食评账号密码。">
  <title>重置密码 · Newmarket 食评</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/simple.css">
  <link rel="stylesheet" href="/reset-password.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">食</span>
      <span>Newmarket 食评<small>RESTO RATING</small></span>
    </a>
  </header>
  <main class="reset-page">
    <section class="reset-panel">
      <span class="eyebrow">账号安全</span>
      <h1>设置新密码</h1>
      <p id="resetDescription">新密码至少需要 8 个字符。</p>
      <form id="resetPasswordForm" class="form-stack">
        <label>新密码<input type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="至少 8 个字符"></label>
        <label>确认新密码<input type="password" name="confirmation" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="再次输入新密码"></label>
        <button class="btn btn-primary btn-full" type="submit">确认重置密码</button>
      </form>
      <a class="reset-home" href="/">返回首页</a>
    </section>
  </main>
  <div id="resetToast" class="toast-region" aria-live="assertive"></div>
  <script src="/reset-password.js" defer></script>
</body>
</html>
